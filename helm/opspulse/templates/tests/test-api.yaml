apiVersion: v1
kind: Pod
metadata:
  name: {{ include "opspulse.fullname" . }}-test-api
  labels:
    {{- include "opspulse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke-test
      image: {{ include "opspulse.image" (dict "image" .Values.backend.image "component" "backend") | quote }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "opspulse.componentName" (dict "ctx" . "component" "backend") }}:8000"
          assert json.load(urllib.request.urlopen(base + "/ready"))["status"] == "READY"
          assert isinstance(json.load(urllib.request.urlopen(base + "/api/services")), list)
          print("OpsPulse API is ready and serving data")
      securityContext:
        {{- include "opspulse.containerSecurityContext" . | nindent 8 }}
