apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opspulse.componentName" (dict "ctx" . "component" "backend") }}
  labels:
    {{- include "opspulse.labels" . | nindent 4 }}
data:
  OPSPULSE_ENVIRONMENT: {{ .Values.backend.environment | quote }}
  OPSPULSE_LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
  OPSPULSE_SEED_DEMO_DATA: {{ .Values.backend.seedDemoData | quote }}
  OPSPULSE_DB_HOST: {{ include "opspulse.componentName" (dict "ctx" . "component" "postgres") | quote }}
  OPSPULSE_DB_PORT: "5432"
  OPSPULSE_DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  OPSPULSE_DB_USER: {{ .Values.postgresql.auth.username | quote }}
  # Migrations run once per rollout in the init container, not in every API process.
  OPSPULSE_RUN_MIGRATIONS: "false"
