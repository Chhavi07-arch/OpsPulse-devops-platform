name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "v0.75.0"

jobs:
  # ---------------------------------------------------------------- build & test
  backend-test:
    name: Backend · lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: application/backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (pytest)
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --junitxml=pytest-report.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            application/backend/pytest-report.xml
            application/backend/coverage.xml

  frontend-build:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: application/frontend/dist

  # ---------------------------------------------------------------- security scans
  sast:
    name: Security · SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (Python)
        run: |
          pip install bandit==1.9.4
          bandit -r application/backend/app -c application/backend/pyproject.toml \
            --severity-level medium --confidence-level medium
      - name: Semgrep (Python, JavaScript, Docker, Kubernetes)
        run: |
          pip install semgrep
          semgrep scan --config p/default --severity ERROR --error --metrics=off

  sca:
    name: Security · SCA (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (backend)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r application/backend/requirements.txt --strict --desc
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (frontend runtime dependencies)
        working-directory: application/frontend
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Security · secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --no-banner

  iac-scan:
    name: Security · IaC misconfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan (Helm, Kubernetes, Terraform, Dockerfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-config: security/trivy.yaml
          trivyignores: security/.trivyignore

  # ---------------------------------------------------------------- images
  images:
    name: Image · ${{ matrix.component }}
    needs: [backend-test, frontend-build, sast, sca, secret-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opspulse-${{ matrix.component }}:${{ github.sha }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy image scan (report to GitHub code scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          ignore-unfixed: true
      - name: Upload Trivy results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}
      - name: Security gate — fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (tag = commit SHA)
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"

  # ---------------------------------------------------------------- deploy
  deploy-test:
    name: Deploy · Kubernetes (kind) + Helm test
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: opspulse-ci
      - name: Namespace and registry credentials
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl create secret docker-registry ghcr -n opspulse \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
      - name: Helm install (images pushed by this run)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install opspulse helm/opspulse -n opspulse \
            --set backend.image.repository="ghcr.io/${OWNER}/opspulse-backend" \
            --set frontend.image.repository="ghcr.io/${OWNER}/opspulse-frontend" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.tag="${{ github.sha }}" \
            --set "imagePullSecrets[0].name=ghcr" \
            --set postgresql.auth.password="$(openssl rand -hex 16)" \
            --wait --timeout 6m
      - name: Helm test (API ready and serving data)
        run: helm test opspulse -n opspulse --logs
      - name: Show deployed resources
        if: always()
        run: |
          kubectl get pods,svc,ingress,hpa,pvc -n opspulse
          kubectl get events -n opspulse --sort-by=.lastTimestamp | tail -20

  gitops-promote:
    name: GitOps · promote to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the production environment at this commit's images
        env:
          TAG: ${{ github.sha }}
        run: |
          FILE=gitops/environments/production/values.yaml
          yq -i '.backend.image.tag = strenv(TAG) | .frontend.image.tag = strenv(TAG)' "$FILE"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add "$FILE"
          git commit -m "deploy: promote ${TAG::7} to production [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
