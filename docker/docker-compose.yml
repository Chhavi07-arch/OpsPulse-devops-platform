# Full local stack: cp .env.example .env, then `docker compose up --build` from this folder.
name: opspulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspulse}
      POSTGRES_USER: ${POSTGRES_USER:-opspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      OPSPULSE_ENVIRONMENT: ${OPSPULSE_ENVIRONMENT:-local}
      OPSPULSE_DB_HOST: postgres
      OPSPULSE_DB_NAME: ${POSTGRES_DB:-opspulse}
      OPSPULSE_DB_USER: ${POSTGRES_USER:-opspulse}
      OPSPULSE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPSPULSE_SEED_DEMO_DATA: ${OPSPULSE_SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    environment:
      OPSPULSE_API_UPSTREAM: http://backend:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
